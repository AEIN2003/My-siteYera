<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Для тебя</title>
<style>
  :root { --bg1:#2a0f1e; --bg2:#4d1b30; --cream:#fbeee0; --dim:#d9b8b0; --gold:#f2b27a; --line:rgba(251,238,224,.35); }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; color:var(--cream); font-family: Georgia, "Times New Roman", serif;
    background:linear-gradient(180deg,var(--bg1),var(--bg2) 60%,var(--bg1)); background-attachment:fixed; overflow-x:hidden; }
  section { min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:48px 24px; gap:22px; }
  h1 { font-size:clamp(44px,13vw,110px); font-weight:400; font-style:italic; margin:0; line-height:1.05; letter-spacing:-.02em; }
  h2 { font-size:clamp(26px,6vw,40px); font-weight:400; margin:0; }
  p { margin:0; font-size:clamp(17px,4.5vw,21px); line-height:1.6; max-width:34ch; color:var(--dim); }
  button { font:inherit; font-size:18px; color:var(--cream); background:rgba(251,238,224,.08);
    border:1px solid var(--line); border-radius:999px; padding:14px 28px; cursor:pointer; transition:background .2s, transform .2s; }
  button:hover { background:rgba(251,238,224,.18); }
  button:active { transform:scale(.97); }
  button:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }
  button.main { background:var(--gold); color:#3a1424; border-color:var(--gold); font-weight:700; }
  button.main:hover { background:#f7c498; }
  #main { display:none; }
  .timer { display:flex; gap:clamp(12px,4vw,28px); }
  .timer div { min-width:64px; }
  .timer b { display:block; font-size:clamp(34px,10vw,60px); font-weight:400; color:var(--gold); font-variant-numeric:tabular-nums; }
  .timer span { font-size:14px; color:var(--dim); }
  .card { min-height:140px; max-width:30ch; font-size:clamp(20px,5.5vw,26px); font-style:italic; line-height:1.5; color:var(--cream); }
  .letter { max-width:36ch; font-size:clamp(17px,4.6vw,20px); line-height:1.75; font-style:italic; text-align:left;
    white-space:pre-wrap; min-height:12em; color:var(--cream); }
  .row { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .heart { position:fixed; top:-40px; pointer-events:none; z-index:9; animation:fall linear forwards; }
  @keyframes fall { to { transform:translateY(112vh) rotate(40deg); opacity:.2; } }
  #no { transition:left .25s, top .25s; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior:auto; } .heart { animation-duration:.01s !important; } }
</style>
</head>
<body>

<section id="intro">
  <p>У меня для тебя кое-что есть</p>
  <h1 id="name">Любимая</h1>
  <button class="main" id="open">Открыть</button>
</section>

<div id="main">
  <section>
    <h2>Мы вместе уже</h2>
    <div class="timer">
      <div><b id="d">0</b><span>дней</span></div>
      <div><b id="h">0</b><span>часов</span></div>
      <div><b id="m">0</b><span>минут</span></div>
      <div><b id="s">0</b><span>секунд</span></div>
    </div>
    <p>И я не хочу, чтобы эти цифры останавливались.</p>
  </section>

  <section>
    <h2>Почему я тебя люблю</h2>
    <div class="card" id="reason">Нажми на кнопку</div>
    <button id="why">Ещё одна причина</button>
  </section>

  <section>
    <h2>Письмо тебе</h2>
    <div class="letter" id="letter"></div>
    <button id="read">Открыть письмо</button>
  </section>

  <section id="ask">
    <h2 id="q">Один важный вопрос</h2>
    <p id="qsub">Ты рада, что я есть в твоей жизни?</p>
    <div class="row">
      <button class="main" id="yes">Да</button>
      <button id="no">Нет</button>
    </div>
  </section>
</div>

<script>
/* ============ ИЗМЕНИТЕ ЗДЕСЬ ============ */
var CONFIG = {
  name: 'Aidana',            // её имя или ласковое слово
  start: '2026-08-08T00:00:00', // дата, когда вы начали встречаться: ГГГГ-ММ-ДДTЧЧ:ММ:СС
  reasons: [
    'Ты улыбаешься так, что у меня пропадают все плохие мысли.',
    'С тобой даже обычный вечер становится особенным.',
    'Ты умеешь поддержать, когда мне тяжело.',
    'Твой смех — мой любимый звук.',
    'Рядом с тобой я хочу быть лучше.',
    'Ты настоящая, и это дороже всего.',
    'Мне просто хорошо, когда ты рядом.'
  ],
  letter: 'Привет, родная.\n\nЯ долго думал, как сказать тебе всё, что у меня на душе, и решил сделать этот маленький сайт.\n\nСпасибо, что ты рядом. Спасибо за твоё терпение, твоё тепло и за то, что ты принимаешь меня таким, какой я есть.\n\nЯ хочу, чтобы у нас было ещё много-много дней, и чтобы в каждом из них ты чувствовала, что тебя любят.\n\nТвой ❤',
  yesText: 'Я так и знал. Люблю тебя!',
  yesSub: 'Теперь ты точно моя на всю жизнь.'
};
/* ======================================== */

var $ = function (id) { return document.getElementById(id); };
$('name').textContent = CONFIG.name;
var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function hearts(n) {
  var set = ['❤', '💗', '💖', '💕', '✨'];
  for (var i = 0; i < n; i++) {
    var h = document.createElement('span');
    h.className = 'heart';
    h.textContent = set[(Math.random() * set.length) | 0];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (16 + Math.random() * 28) + 'px';
    h.style.animationDuration = (3 + Math.random() * 3) + 's';
    h.style.animationDelay = (Math.random() * 1.2) + 's';
    h.addEventListener('animationend', function () { this.remove(); });
    document.body.appendChild(h);
  }
}

$('open').onclick = function () {
  $('main').style.display = 'block';
  hearts(25);
  setTimeout(function () {
    $('main').firstElementChild.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' });
  }, 50);
};

/* счётчик */
var start = new Date(CONFIG.start).getTime();
function tick() {
  var diff = Math.max(0, Date.now() - start) / 1000;
  $('d').textContent = Math.floor(diff / 86400);
  $('h').textContent = Math.floor(diff % 86400 / 3600);
  $('m').textContent = Math.floor(diff % 3600 / 60);
  $('s').textContent = Math.floor(diff % 60);
}
tick(); setInterval(tick, 1000);

/* причины */
var lastR = -1;
$('why').onclick = function () {
  var i;
  do { i = (Math.random() * CONFIG.reasons.length) | 0; } while (i === lastR && CONFIG.reasons.length > 1);
  lastR = i;
  $('reason').textContent = CONFIG.reasons[i];
  hearts(6);
  $('why').textContent = 'Ещё одна причина';
};

/* письмо с эффектом печати */
var typing = false;
$('read').onclick = function () {
  if (typing) return;
  typing = true; $('read').style.visibility = 'hidden';
  var t = CONFIG.letter, i = 0, el = $('letter');
  el.textContent = '';
  if (reduce) { el.textContent = t; return; }
  (function step() {
    el.textContent = t.slice(0, ++i);
    if (i < t.length) setTimeout(step, 45); else hearts(12);
  })();
};

/* убегающая кнопка «Нет» */
var no = $('no'), tries = 0;
var phrases = ['Нет', 'Точно?', 'Подумай ещё', 'Ну пожалуйста', 'Не получится :)'];
function dodge(e) {
  if (e && e.cancelable) e.preventDefault();
  tries++;
  no.textContent = phrases[Math.min(tries, phrases.length - 1)];
  var r = no.getBoundingClientRect();
  no.style.position = 'fixed';
  no.style.left = Math.random() * (innerWidth - r.width - 20) + 10 + 'px';
  no.style.top = Math.random() * (innerHeight - r.height - 20) + 10 + 'px';
}
no.addEventListener('pointerenter', dodge);
no.addEventListener('pointerdown', dodge);
no.addEventListener('click', dodge);

$('yes').onclick = function () {
  $('q').textContent = CONFIG.yesText;
  $('qsub').textContent = CONFIG.yesSub;
  no.style.display = 'none'; $('yes').style.display = 'none';
  hearts(70);
  setTimeout(function () { hearts(50); }, 1500);
};
</script>
</body>
</html>
